name: Build exporter image

# Required source gate: build on every push to main and every PR, with no path filters.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build-only. Exact-SHA publication belongs to private johnny/registry-publishers;
# no registry/release/dispatcher credential. Builds/publication share VM10126 by owner decision.
concurrency:
  group: exporter-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE: candidate-immich-prometheus-exporter-build:run-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm exact event commit
        env:
          REVISION: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVISION"

      # Local-only candidate (amd64; the cluster and LXCs are x86). No push, no login, no secrets.
      - name: Build candidate (no registry credentials)
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load \
            --label "org.opencontainers.image.revision=${{ github.sha }}" -t "$CANDIDATE" .
