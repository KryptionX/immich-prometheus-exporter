name: secret-probe
on:
  push:
    branches: ['p4/secret-resolution-probe']
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PROBE: ${{ secrets.GHCR_TOKEN }}
    steps:
      - name: Boolean and length only; no image build, no login, no publish
        run: |
          if [ -n "$PROBE" ]; then echo "GHCR_TOKEN visible: YES length ${#PROBE}"; else echo "GHCR_TOKEN visible: NO"; fi
